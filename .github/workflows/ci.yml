name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API client is generated from the committed spec
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Admin console builds
        run: pnpm --filter admin build
        env:
          OAKLY_API_ORIGIN: http://127.0.0.1:8000
